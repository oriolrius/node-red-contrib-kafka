name: Publish to npm on tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '22', '24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          TEST_LIVE_TLS: '1'

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC): no NPM_TOKEN; provenance is attached automatically
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm supports trusted publishing (>= 11.5.1)
        run: npx --yes semver@7 -r '>=11.5.1' "$(npm -v)"

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Publish to npm
        run: npm publish --access public
