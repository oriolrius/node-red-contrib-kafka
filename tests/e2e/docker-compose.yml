services:
  broker:
    image: apache/kafka:4.1.0
    container_name: kafka-e2e-test
    hostname: broker
    ports:
      - "58092:58092"
    environment:
      # Single-node KRaft (Kafka 4.x no longer supports ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # PLAINTEXT for the tests on the host, INTERNAL for containers (Schema Registry)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://:58092,INTERNAL://:19092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:58092,INTERNAL://broker:19092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # Sensible single-node defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:58092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Only started by the Schema Registry suites: docker compose --profile registry up
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.2
    container_name: schema-registry-e2e-test
    profiles: ["registry"]
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "58081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://broker:19092"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
